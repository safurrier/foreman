name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          install: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Setup
        run: mise run setup

      - name: Check
        run: mise run check

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test-results/
            apps/*/test-results/
          if-no-files-found: ignore

  agent-entrypoints-real:
    name: Real Agent Entrypoints
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          install: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Setup
        run: mise run setup

      - name: Install Harness Kit
        # v0.3.0, pinned so CI cannot change if the tag moves.
        run: uv tool install 'git+https://github.com/safurrier/harness-toolkit.git@c4bde2dbe1600a4aea7239ed40a500fb175ab182'

      - name: Verify real agent entrypoints
        run: mise run verify-agent-entrypoints

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: foreman:verify
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify:
    name: Full Validation
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          install: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Setup
        run: mise run setup

      - name: Verify
        run: mise run verify
        env:
          FOREMAN_VERIFY_SKIP_DOCKER_BUILD: "1"

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-evidence
          path: |
            .ai/validation/ux/
            .ai/validation/release/
          if-no-files-found: error
